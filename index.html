<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychology-based AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 700px;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f7f7f7;
        }
        
        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .user-message {
            text-align: right;
        }
        
        .ai-message {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }
        
        .character {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            margin-bottom: 2px;
        }
        
        .robot {
            width: 32px;
            height: 32px;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-4px);
            }
        }
        
        .robot-body {
            width: 20px;
            height: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            position: relative;
            margin: 0 auto;
        }
        
        .robot-antenna {
            position: absolute;
            width: 2px;
            height: 8px;
            background: #667eea;
            top: -6px;
            border-radius: 1px;
        }
        
        .robot-antenna-left {
            left: 4px;
            animation: wobble-left 2s ease-in-out infinite;
        }
        
        .robot-antenna-right {
            right: 4px;
            animation: wobble-right 2s ease-in-out infinite;
        }
        
        @keyframes wobble-left {
            0%, 100% { transform: rotate(-15deg); }
            50% { transform: rotate(15deg); }
        }
        
        @keyframes wobble-right {
            0%, 100% { transform: rotate(15deg); }
            50% { transform: rotate(-15deg); }
        }
        
        .robot-eyes {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 3px;
            position: relative;
            z-index: 1;
        }
        
        .robot-eye {
            width: 4px;
            height: 5px;
            background: #fff;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }
        
        .robot-pupil {
            width: 2px;
            height: 2px;
            background: #667eea;
            border-radius: 50%;
            position: absolute;
            top: 1px;
            left: 1px;
            animation: blink 2s ease-in-out infinite;
        }
        
        @keyframes blink {
            0%, 45%, 55%, 100% {
                opacity: 1;
            }
            48%, 52% {
                opacity: 0;
            }
        }
        
        .robot-mouth {
            width: 8px;
            height: 2px;
            background: #fff;
            margin: 3px auto 0;
            border-radius: 1px;
            animation: smile 2.5s ease-in-out infinite;
        }
        
        @keyframes smile {
            0%, 20%, 100% {
                width: 8px;
                height: 2px;
            }
            50% {
                width: 8px;
                height: 3px;
            }
        }
        
        .user-message .bubble {
            background: #667eea;
            color: white;
            border-radius: 18px 18px 0 18px;
            padding: 10px 15px;
            display: inline-block;
            max-width: 80%;
            word-wrap: break-word;
        }
        
        .ai-message .bubble {
            background: white;
            color: #333;
            border-radius: 18px 18px 18px 0;
            padding: 10px 15px;
            display: inline-block;
            max-width: 80%;
            word-wrap: break-word;
            border: 1px solid #e0e0e0;
        }
        
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid #e8e8e8;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            background: #fafafa;
        }
        
        #message-input {
            flex: 1;
            border: 1.5px solid #e0e0e0;
            border-radius: 20px;
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            resize: none;
            overflow: hidden;
            min-height: 40px;
            max-height: 120px;
            line-height: 1.5;
            transition: all 0.2s ease;
            background: white;
        }
        
        #message-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        #message-input::placeholder {
            color: #999;
            font-weight: 400;
        }
        
        #send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 11px 26px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
            flex-shrink: 0;
            min-width: 70px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        #send-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.3);
        }
        
        .typing {
            display: flex;
            gap: 4px;
            padding: 10px 15px;
            background: white;
            border-radius: 18px 18px 18px 0;
            border: 1px solid #e0e0e0;
        }
        
        .typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: typing 1.4s infinite;
        }
        
        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Unspoken AI</h1>
            <p>I understand your feelings, not just your words</p>
        </div>
        <div class="chat-box" id="chat-box"></div>
        <div class="input-area">
            <textarea 
                id="message-input" 
                placeholder="Type your message here..."
            ></textarea>
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        // Track what was deleted
        let deletedTexts = [];
        let lastText = messageInput.value;
        
        // ============================================================
        // DRAFT READER AI
        // ============================================================
        // The Draft Reader detects when you type a message but then
        // delete it completely (clear the textarea). When the input
        // becomes empty after being populated, the AI automatically
        // responds to what you were going to say.
        // 
        // This is inspired by the concept that what we *don't* say
        // is often more important than what we do say.
        // ============================================================
        let lastDraft = '';
        let hadContent = false;
        let draftReadTimeout = null;

        messageInput.addEventListener('input', function() {
            const currentText = this.value;
            
            // Detect deletions
            if (currentText.length < lastText.length) {
                const deleted = lastText.substring(currentText.length);
                if (deleted.trim()) {
                    deletedTexts.push(deleted);
                    // Send to backend
                    fetch('/api/capture_deleted', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: deleted })
                    }).catch(err => console.error('Failed to capture deleted:', err));
                }
            }
            
            lastText = currentText;
            
            // Draft Reader: Track content state
            const isGrowing = currentText.length >= lastText.length; 
            if (currentText.trim().length > 0) {
                hadContent = true;
                lastDraft = currentText.trim();
                // Clear any pending draft read
                if (draftReadTimeout) clearTimeout(draftReadTimeout);
            } else if (hadContent && currentText.trim().length === 0) {
                // Input became empty after having content - trigger Draft Reader
                hadContent = false;
                lastDraft = '';
                if (lastDraft.trim()) {
                    // Debounce slightly to avoid accidental triggers
                    if (draftReadTimeout) clearTimeout(draftReadTimeout);
                    draftReadTimeout = setTimeout(() => {
                        triggerDraftReader(lastDraft);
                    }, 100);
                }
            }
            
            // Auto-resize textarea
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Add user message to chat
            addMessage(message, 'user');
            messageInput.value = '';
            messageInput.style.height = 'auto';
            lastText = '';

            // Show typing indicator
            showTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                removeTypingIndicator();

                if (data.error) {
                    addMessage('Error: ' + data.error, 'ai');
                } else {
                    addMessage(data.response, 'ai');
                }
            } catch (error) {
                removeTypingIndicator();
                addMessage('Sorry, I encountered an error. Please try again.', 'ai');
                console.error('Error:', error);
            }
        }

        async function triggerDraftReader(draft) {
            // AI detects and responds to the discarded draft
            addMessage(draft, 'user');
            
            // Log the draft read to the backend
            fetch('/api/draft_read', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ draft: draft })
            }).catch(err => console.error('Failed to log draft read:', err));
            
            // Show typing indicator
            showTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: draft })
                });

                const data = await response.json();
                removeTypingIndicator();

                if (data.error) {
                    addMessage('Error: ' + data.error, 'ai');
                } else {
                    addMessage(data.response, 'ai');
                }
            } catch (error) {
                removeTypingIndicator();
                addMessage('Sorry, I encountered an error. Please try again.', 'ai');
                console.error('Error:', error);
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + sender + '-message';
            
            if (sender === 'ai') {
                messageDiv.innerHTML = `
                    <div class="character">
                        <div class="robot">
                            <div class="robot-antenna robot-antenna-left"></div>
                            <div class="robot-antenna robot-antenna-right"></div>
                            <div class="robot-body">
                                <div class="robot-eyes">
                                    <div class="robot-eye">
                                        <div class="robot-pupil"></div>
                                    </div>
                                    <div class="robot-eye">
                                        <div class="robot-pupil"></div>
                                    </div>
                                </div>
                                <div class="robot-mouth"></div>
                            </div>
                        </div>
                    </div>
                    <div class="bubble">${escapeHtml(text)}</div>
                `;
            } else {
                messageDiv.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
            }
            
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai-message';
            typingDiv.id = 'typing-indicator';
            typingDiv.innerHTML = `
                <div class="character">
                    <div class="robot">
                        <div class="robot-antenna robot-antenna-left"></div>
                        <div class="robot-antenna robot-antenna-right"></div>
                        <div class="robot-body">
                            <div class="robot-eyes">
                                <div class="robot-eye">
                                    <div class="robot-pupil"></div>
                                </div>
                                <div class="robot-eye">
                                    <div class="robot-pupil"></div>
                                </div>
                            </div>
                            <div class="robot-mouth"></div>
                        </div>
                    </div>
                </div>
                <div class="typing"><span></span><span></span><span></span></div>
            `;
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeTypingIndicator() {
            const typing = document.getElementById('typing-indicator');
            if (typing) typing.remove();
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Focus on input on load
        messageInput.focus();
    </script>
</body>
</html>
